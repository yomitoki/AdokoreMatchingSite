<style>
  header {
    width: 100%;
    height: 50px;
    background-color: #f5f5f5;
    /* 背景色 */
    padding: 0 20px;
    box-sizing: border-box;
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
  }


  header h1 {
    margin: 0;
    font-size: 24px;
  }

  header .gnav .menu {
    display: flex;
  }

  header .gnav .menu li {
    list-style: none;
  }

  header .gnav .menu li+li {
    margin-left: 40px;
  }

  main {
    padding-top: 90px;
    height: 100vw;
  }

  h2 {
    font-size: 16px;
    text-align: center;
  }

  table {
    padding-top: 90px;
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    border: 1px solid #000;
    padding: 10px;
    text-align: center;
  }

  button {
    padding: 5px 10px;
    font-size: 16px;
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 50px;
  }

  #timer {
    margin-left: 20px;
    font-size: 24px;
    font-weight: bold;
  }

  .maintable {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    /* 下のテーブルとの間隔 */
  }


  /* 横並びテーブルをコンテナに配置 */
  .table-container {
    display: flex;
    flex-wrap: nowrap;
    /* テーブルが横に並び、折り返さないようにします */
    overflow-x: auto;
    /* テーブルが横に並びすぎる場合はスクロールバーを表示します */
    justify-content: center;
  }

  /* 横並びテーブルのスタイル */
  .sub-table {
    width: 25%;
    /* 3つのテーブルが均等に並ぶように幅を設定 */
    border-collapse: collapse;
  }

  .sub-table th,
  .sub-table td {
    border: 1px solid #ccc;
    padding: 7px;
    text-align: center;
  }

  .sub-table th {
    background-color: #f4f4f4;
  }

  .popup {
    display: none;
    /* 初期状態で非表示 */
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.4);
    /* 背景の半透明効果 */
  }

  .popup-content {
    background-color: #fff;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 100%;
    text-align: center;
    max-width: 800px;
    border-radius: 10px;
  }

  .event-popup-content {
    background-color: #fff;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 100%;
    text-align: center;
    max-width: 800px;
    border-radius: 10px;
  }

  .close-btn {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
  }

  .close-btn:hover,
  .close-btn:focus {
    color: #000;
    text-decoration: none;
    cursor: pointer;
  }

header {

}

  // タイマーをスタートする関数
  function startTimer() {
    interval = setInterval(function () {
      seconds--;
      timer.textContent = new Date(seconds * 1000).toISOString().substr(11, 8);

      if (seconds <= 0) {
        clearInterval(interval);
        // ゼロ秒になった場合に「待機解除」と同じ処理を行う
        let userId = getUserId();
        if (userId) {
          google.script.run.withSuccessHandler(function () {
            fetchRowData();
            updateValues(); // Google Scriptの処理が成功した後に呼ばれる
          }).toggleButton(userId, "", "", "", "");
        }
      }
    }, 1000);
  }
  // タイマーをリセットして0に設定する関数
  function resetTimerToZero() {
    clearInterval(interval);
    seconds = 0;
    timer.textContent = "00:00:00";
  }

  function updateSubTableData(tableId, data) {
    const tableBody = document.querySelector(`#${tableId} tbody`);

    if (!tableBody) {
      console.error(`Table with ID ${tableId} not found`);
      return;
    }

    tableBody.innerHTML = ''; // テーブルの内容をクリア

    if (Array.isArray(data)) {
      // データの最大行数を決定
      const maxRows = data[0].length;

      for (let rowIndex = 0; rowIndex < maxRows; rowIndex++) {
        const tr = document.createElement('tr');

        data.forEach((columnData) => {
          const td = document.createElement('td');
          td.textContent = columnData;
          tr.appendChild(td);
        });

        tableBody.appendChild(tr);
      }
    } else {
      console.error(`Data for table ${tableId} is not an array:`, data);
    }
  }

  function fetchEventnum(hiddenData) {
    return new Promise((resolve, reject) => {
      var ruleFilter = hiddenData;

      google.script.run.withSuccessHandler(function (eventList) {
        var eventsDiv = document.getElementById('events');
        //eventsDiv.innerHTML = '';

        if (eventList.length === 0) {
          // eventsDiv.innerHTML = 'イベントはありません。';

          resolve(0); // イベントがない場合、0を返す
          return;
        }

        // フィルタリング処理
        var filteredEvents = eventList.filter(function (event) {
          var matchesRule = ruleFilter === '' || event.location === ruleFilter;
          return matchesRule;
        });

        if (filteredEvents.length === 0) {
          //eventsDiv.innerHTML = '指定のルールのイベントはありません。';

          resolve(0); // フィルタリング後にイベントがない場合
          return;
        }

        resolve(filteredEvents.length); // イベント数を返す
      }).getCalendarEvents();
    });

  }

// fetchEvents 関数
function fetchEvents(hiddenData) {
  var ruleFilter = hiddenData;
  var userid;
  
  google.script.run.withSuccessHandler(function (eventList) {
    var eventsDiv = document.getElementById('events');
    eventsDiv.innerHTML = ''; // イベント表示をクリア

    if (eventList.length === 0) {
      eventsDiv.innerHTML = 'イベントはありません。';
      document.getElementById('eventdetail_popup').style.display = 'block';
      return;
    }

    // フィルタリング処理
    var filteredEvents = eventList.filter(function (event) {
      var matchesRule = ruleFilter === '' || event.location === ruleFilter;
      return matchesRule;
    });

    if (filteredEvents.length === 0) {
      eventsDiv.innerHTML = '指定のルールのイベントはありません。';
      document.getElementById('eventdetail_popup').style.display = 'block';
      return;
    }

    filteredEvents.forEach(function (event, index) {
      var startTime = new Date(event.startTime);
      var endTime = new Date(event.endTime);

      var startDateStr = startTime.toLocaleDateString();
      var startTimeStr = startTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      var endTimeStr = endTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      // イベントサマリー
      var eventSummary = event.title + " " + startDateStr + " " + startTimeStr + " - " + endTimeStr;

      // イベントコンテナを作成

    tablinks = document.getElementsByClassName("tab-button");
