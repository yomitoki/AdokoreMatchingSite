<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  header {
    width: 100%;
    height: 50px;
    background-color: #f5f5f5;
    /* 背景色 */
    padding: 0 20px;
    box-sizing: border-box;
    position: fixed;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
  }


  header h1 {
    margin: 0;
    font-size: 24px;
  }

  header .gnav .menu {
    display: flex;
  }

  header .gnav .menu li {
    list-style: none;
  }

  header .gnav .menu li+li {
    margin-left: 40px;
  }

  main {
    padding-top: 90px;
  }

  h2 {
    font-size: 16px;
    text-align: center;
  }

  table {
    padding-top: 90px;
    width: 100%;
    border-collapse: collapse;
  }

  th,
  td {
    border: 1px solid #000;
    padding: 10px;
    text-align: center;
  }

  button {
    padding: 5px 10px;
    font-size: 16px;
  }

  .container {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 50px;
  }

  #timer {
    margin-left: 20px;
    font-size: 24px;
    font-weight: bold;
  }

  .maintable {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    /* 下のテーブルとの間隔 */
  }


  /* 横並びテーブルをコンテナに配置 */
  .table-container {
    display: flex;
    flex-wrap: nowrap;
    /* テーブルが横に並び、折り返さないようにします */
    overflow-x: auto;
    /* テーブルが横に並びすぎる場合はスクロールバーを表示します */
    justify-content: center;
  }

  /* 横並びテーブルのスタイル */
  .sub-table {
    width: 25%;
    /* 3つのテーブルが均等に並ぶように幅を設定 */
    border-collapse: collapse;
  }

  .sub-table th,
  .sub-table td {
    border: 1px solid #ccc;
    padding: 7px;
    text-align: center;
  }

  .sub-table th {
    background-color: #f4f4f4;
  }

  .popup {
    display: none;
    /* 初期状態で非表示 */
    position: fixed;
    z-index: 1;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0, 0, 0, 0.4);
    /* 背景の半透明効果 */
  }

  .popup-content {
    background-color: #fff;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 100%;
    text-align: center;
    max-width: 800px;
    border-radius: 10px;
  }

  .event-popup-content {
    background-color: #fff;
    margin: 15% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 100%;
    text-align: center;
    max-width: 800px;
    border-radius: 10px;
  }

  /* 余白込みで画面幅に収める（スマホで横にはみ出さないように） */
  .popup-content,
  .event-popup-content {
    box-sizing: border-box;
  }

  #calendarFrame {
    width: 100%;
    max-width: 800px;
  }

  .close-btn {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
  }

  .close-btn:hover,
  .close-btn:focus {
    color: #000;
    text-decoration: none;
    cursor: pointer;
  }

header {
  display: flex;
  justify-content: space-between; /* タイトルとボタンを左右に分ける */
  align-items: center; /* タイトルとボタンを縦に中央揃え */
}

header h1 {
  margin: 0;  /* 余計な余白をなくす */
  font-size: 24px;  /* タイトルのフォントサイズ */
}

header .button-group {
  display: flex;
  gap: 0; /* ボタン間の余白をなくす */
}

header button {
  height: 100%;
  padding: 10px 20px;
  font-size: 16px;
  margin: 0;
}

  /* ===== 通知（トースト） ===== */
  .toast-container {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-width: min(420px, calc(100vw - 32px));
  }

  .toast {
    padding: 10px 14px;
    border-radius: 6px;
    color: #fff;
    background-color: #37474f;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    white-space: pre-line;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.5;
  }

  .toast-success { background-color: #1e7e34; }
  .toast-error { background-color: #c62828; }

  /* ===== 処理中・状態表示 ===== */
  button:disabled {
    cursor: not-allowed;
  }

  button.is-busy {
    opacity: 0.6;
    cursor: progress;
  }

  .sync-status {
    margin-left: 16px;
    font-size: 13px;
    color: #555;
  }

  .sync-status.is-error {
    color: #c62828;
  }

  .notice {
    text-align: center;
    color: #8a5300;
    background-color: #fff8e1;
    border: 1px solid #ffe0a3;
    border-radius: 6px;
    padding: 8px;
    margin: 8px auto;
    max-width: 800px;
  }

  #dynamicTable tbody.is-stale {
    opacity: 0.5;
  }

  #dynamicTable tr.has-waiting td.col-rule {
    background-color: #e8f5e9;
    font-weight: bold;
  }

  .sub-table td.is-clickable {
    cursor: pointer;
  }

  .sub-table td.is-clickable:hover {
    background-color: #f0f7ff;
  }

  .sub-table td.is-current {
    background-color: #fff3cd;
    font-weight: bold;
  }

  /* ===== イベント表示 ===== */
  .event-item {
    border: 1px solid #ccc;
    padding: 10px;
    margin: 10px 0;
  }

  .event-summary {
    cursor: pointer;
    margin: 10px 0;
  }

  .event-actions {
    margin-top: 10px;
  }

  .event-actions button + button {
    margin-left: 8px;
  }

  .participant-count {
    margin-left: 10px;
  }

  .multiline {
    white-space: pre-wrap;
  }
</style>
</head>

<script>
  // =====================================================================
  //  設定値
  // =====================================================================
  const POLL_INTERVAL_MS = 10000;       // 自動更新の間隔
  const IDLE_POLL_INTERVAL_MS = 30000;  // しばらく操作がないときの自動更新の間隔
  const IDLE_AFTER_MS = 5 * 60 * 1000;  // この時間操作がなければ「放置中」とみなす
  const POLL_MAX_DELAY_MS = 60000;      // 更新の失敗が続いたときの最大間隔
  const SERVER_TIMEOUT_MS = 30000;  // サーバー応答を待つ上限
  const WAIT_SECONDS = 300;         // 待機の有効時間（サーバー側の自動解除と同じ5分）
  const VERSION_LIST = ['exe1', 'exe2', 'exe3', 'exe4', 'exe5', 'exe6'];
  const SUB_TABLES = [['table1', 'Switch'], ['table2', 'PS4/PS5'], ['table3', 'Steam']];
  const POPUP_IDS = ['detail_popup', 'eventsetting_popup', 'eventdetail_popup', 'eventcalendar_popup'];

  const gametypeSelect = document.getElementById('gametypes');
  const versionSelect = document.getElementById('versions');
  const mainTbody = document.querySelector('#dynamicTable tbody');
  const timerElement = document.getElementById('timer');
  const insertplatform = document.getElementById('insertplatform');
  const insertversion = document.getElementById('insertversion');

  const state = {
    pageSeq: 0,          // 画面データ要求の通し番号（古い応答で上書きしないため）
    pollTimer: null,
    pollDelay: POLL_INTERVAL_MS,
    rows: new Map(),     // hidden → 行データ（ルール詳細の表示に使う）
    calendarId: '',
    rulesCache: {},      // イベント作成画面のルール一覧（環境|バージョン → ルール）
    eventsSeq: 0,
    myEventsSeq: 0,
    addRequestId: null,  // イベント追加の二重登録防止用ID
    timerEndsAt: 0,
    timerInterval: null,
    storageWarned: false,
    memoryUserId: null,
    lastActiveAt: Date.now(),
  };


  // =====================================================================
  //  共通処理: サーバー呼び出し・通知・処理中表示
  // =====================================================================

  // google.script.run を Promise にし、失敗・タイムアウトを必ず検知する
  function callServer(fnName, ...args) {
    return new Promise((resolve, reject) => {
      let settled = false;
      const timer = setTimeout(() => {
        if (settled) return;
        settled = true;
        reject(new Error('サーバーからの応答がありません（タイムアウト）。通信状況を確認してください。'));
      }, SERVER_TIMEOUT_MS);

      google.script.run
        .withSuccessHandler(result => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(result);
        })
        .withFailureHandler(error => {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          reject(error instanceof Error ? error : new Error(String((error && error.message) || error)));
        })[fnName](...args);
    });
  }

  function errorMessage(error) {
    const text = (error && error.message) ? error.message : String(error || '不明なエラー');
    if (/NetworkError|HTTP 0|Failed to fetch/i.test(text)) {
      return '通信エラーが発生しました。ネットワーク接続を確認してください。';
    }
    return text.replace(/^(Error|Exception):\s*/, '');
  }

  function showToast(message, type = 'info', timeoutMs) {
    const box = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.setAttribute('role', type === 'error' ? 'alert' : 'status');
    toast.textContent = message;
    toast.title = 'クリックで閉じる';
    toast.addEventListener('click', () => toast.remove());
    box.appendChild(toast);
    setTimeout(() => toast.remove(), timeoutMs || (type === 'error' ? 8000 : 4000));
  }

  // 処理中はボタンを押せなくする（連打による二重送信を防ぐ）
  async function withBusy(button, busyText, task) {
    if (button && button.disabled) return;
    const original = button ? button.textContent : '';
    if (button) {
      button.disabled = true;
      button.classList.add('is-busy');
      if (busyText) button.textContent = busyText;
    }
    try {
      return await task();
    } finally {
      if (button) {
        button.disabled = false;
        button.classList.remove('is-busy');
        if (busyText) button.textContent = original;
      }
    }
  }

  // 要素を作る小さなヘルパー（利用者の入力は必ず textContent で入れる）
  function el(tag, props, children) {
    const node = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(key => {
        const value = props[key];
        if (key === 'dataset') Object.assign(node.dataset, value);
        else if (key === 'text') node.textContent = value;
        else if (key in node) node[key] = value;
        else node.setAttribute(key, value);
      });
    }
    (children || []).forEach(child => {
      node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
    });
    return node;
  }

  function setText(node, text) {
    const value = String(text);
    if (node && node.textContent !== value) node.textContent = value;
  }


  // =====================================================================
  //  ユーザーID（ブラウザに保存。保存できない環境でも動くようにする）
  // =====================================================================
  function generateUniqueId() {
    if (window.crypto && crypto.getRandomValues) {
      const bytes = new Uint8Array(8);
      crypto.getRandomValues(bytes);
      return 'user-' + Array.from(bytes, b => (b % 36).toString(36)).join('').slice(0, 9);
    }
    return 'user-' + Math.random().toString(36).slice(2, 11);
  }

  function getStoredUserId() {
    try {
      return localStorage.getItem('userId') || state.memoryUserId;
    } catch (e) {
      return state.memoryUserId;
    }
  }

  function getUserId() {
    let userId = getStoredUserId();
    if (!userId) {
      userId = generateUniqueId();
      state.memoryUserId = userId;
      try {
        localStorage.setItem('userId', userId);
      } catch (e) {
        if (!state.storageWarned) {
          state.storageWarned = true;
          showToast('ブラウザの設定によりユーザーIDを保存できません。ページを再読み込みすると、作成したイベントの編集などができなくなります。', 'error', 12000);
        }
      }
    }
    return userId;
  }


  // =====================================================================
  //  画面データの取得と自動更新
  // =====================================================================
  function currentView() {
    return { gametype: gametypeSelect.value, version: versionSelect.value };
  }

  function setSyncStatus(kind, detail) {
    const status = document.getElementById('sync-status');
    status.classList.toggle('is-error', kind === 'error');
    status.title = detail || '';
    if (kind === 'loading') status.textContent = '更新中…';
    else if (kind === 'ok') status.textContent = '最終更新 ' + new Date().toLocaleTimeString('ja-JP');
    else status.textContent = '更新に失敗しました（自動で再試行します）';
  }

  async function loadPage(options = {}) {
    const view = currentView();
    const seq = ++state.pageSeq;
    clearTimeout(state.pollTimer);  // 通信中は自動更新を割り込ませない（終わったら finally で再予約）
    if (options.showLoading) setSyncStatus('loading');
    try {
      const data = await callServer('getPageData', view.gametype, view.version);
      if (seq !== state.pageSeq) return;  // 後から出した要求があるので、この応答は捨てる
      applyPageData(data);
      state.pollDelay = basePollInterval();
      setSyncStatus('ok');
    } catch (error) {
      if (seq !== state.pageSeq) return;
      state.pollDelay = Math.min(state.pollDelay * 2, POLL_MAX_DELAY_MS);  // 失敗が続いたら間隔を空ける
      mainTbody.classList.remove('is-stale');
      setSyncStatus('error', errorMessage(error));
      if (options.userAction) showToast('画面の更新に失敗しました: ' + errorMessage(error), 'error');
    } finally {
      if (seq === state.pageSeq) schedulePoll();
    }
  }

  // 開いたまま放置されているタブは更新を遅くする（全員の通信が同時実行数の上限30を分け合うため）
  // 待機中（タイマーが動いている間）は放置扱いにしない
  function isIdle() {
    return !state.timerInterval && Date.now() - state.lastActiveAt > IDLE_AFTER_MS;
  }

  function basePollInterval() {
    return isIdle() ? IDLE_POLL_INTERVAL_MS : POLL_INTERVAL_MS;
  }

  ['click', 'keydown', 'scroll', 'touchstart'].forEach(type => {
    document.addEventListener(type, () => {
      const wasIdle = isIdle();
      state.lastActiveAt = Date.now();
      if (wasIdle) loadPage();  // 戻ってきたらすぐ最新にする
    }, { passive: true, capture: true });
  });

  // 前回の更新が終わってから次を予約する（通信が遅いときに要求が積み上がらない）
  function schedulePoll() {
    clearTimeout(state.pollTimer);
    state.pollTimer = setTimeout(() => {
      if (document.hidden) return;  // タブを見ていない間は止める（表示に戻ったら再開）
      loadPage();
    }, state.pollDelay);
  }

  // 操作の応答に含まれる最新データを反映する（追加の通信なし）
  function applyFreshPageData(data) {
    const view = currentView();
    state.pageSeq++;  // 実行中の自動更新の結果で上書きしないようにする
    if (data && data.gametype === view.gametype && data.version === view.version) {
      applyPageData(data);
      state.pollDelay = basePollInterval();
      setSyncStatus('ok');
      schedulePoll();
    } else {
      loadPage();  // 待っている間に表示を切り替えた場合
    }
  }

  function applyPageData(data) {
    if (data.calendarId) state.calendarId = data.calendarId;
    renderMainTable(data);
    renderVersionCounts(data.versionCounts, data);
    const notice = document.getElementById('page-notice');
    notice.textContent = data.eventError || '';
    notice.hidden = !data.eventError;
  }

  function changeView() {
    mainTbody.classList.add('is-stale');
    highlightCurrentVersion(currentView());
    loadPage({ userAction: true, showLoading: true });
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) loadPage();
  });


  // =====================================================================
  //  メインの表
  // =====================================================================
  function jstInputValue(minutesFromNow) {
    const jst = new Date(Date.now() + minutesFromNow * 60000 + 9 * 3600000);
    return jst.toISOString().slice(0, 16);  // "YYYY-MM-DDTHH:mm"（日本時間）
  }

    tr.appendChild(el('td', null, [

    tr.appendChild(el('td', null, [
      el('button', { type: 'button', dataset: { action: 'wait', button: 'button2' }, text: '子待機' }),

    ]));
    tr.appendChild(el('td', null, [

      el('button', { type: 'button', className: 'btn-events', dataset: { action: 'events' }, text: 'イベント情報' }),
    ]));
    return tr;
  }

  function updateRuleRow(tr, row) {
    setText(tr.querySelector('.col-rule'), row.rule);
    setText(tr.querySelector('.count1'), ' ' + row.accessnum1);
    setText(tr.querySelector('.count2'), ' ' + row.accessnum2);
    setText(tr.querySelector('.col-declaration'), row.exbutton2);
    const eventButton = tr.querySelector('.btn-events');
    if (row.eventCount === null || row.eventCount === undefined) setText(eventButton, 'イベント情報');
    else setText(eventButton, row.eventCount > 0 ? 'イベントあり' : 'イベントなし');
    tr.classList.toggle('has-waiting', (row.accessnum1 + row.accessnum2) > 0);

    // ページを開いたままでも、通知時刻の初期値が過去にならないようにする（入力中は触らない）
    const timeInput = tr.querySelector('input.notification-time');
    if (timeInput && document.activeElement !== timeInput && (!timeInput.value || timeInput.value < jstInputValue(0))) {
      timeInput.value = jstInputValue(30);
    }
  }

  // 行は hidden ごとに使い回す（入力中の日時や処理中のボタンを消さないため）
  function renderMainTable(data) {
    const viewKey = data.gametype + '|' + data.version;
    if (mainTbody.dataset.viewKey !== viewKey) {
      mainTbody.textContent = '';
      mainTbody.dataset.viewKey = viewKey;
    }
    mainTbody.classList.remove('is-stale');
    mainTbody.querySelectorAll('tr.placeholder').forEach(tr => tr.remove());

    const existing = new Map();
    mainTbody.querySelectorAll('tr[data-hidden]').forEach(tr => existing.set(tr.dataset.hidden, tr));
    state.rows = new Map(data.rows.map(row => [row.hidden, row]));

    data.rows.forEach((row, index) => {
      let tr = existing.get(row.hidden);
      if (tr) existing.delete(row.hidden);
      else tr = createRuleRow(row);
      updateRuleRow(tr, row);
      if (mainTbody.children[index] !== tr) mainTbody.insertBefore(tr, mainTbody.children[index] || null);
    });
    existing.forEach(tr => tr.remove());

    if (data.rows.length === 0) {
      mainTbody.appendChild(el('tr', { className: 'placeholder' }, [el('td', { colSpan: 8, text: '表示できるルールがありません。' })]));
    }
  }

  // ボタンの処理は表全体で1つにまとめる（行を作り直しても処理が外れない）
  mainTbody.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button) return;
    event.preventDefault();
    const tr = button.closest('tr[data-hidden]');
    const hidden = tr.dataset.hidden;
    switch (button.dataset.action) {
      case 'wait':
        registerWait(button, hidden, button.dataset.button);
        break;
      case 'quick-notify':
        sendParticipation(button, hidden, jstInputValue(30));
        break;
      case 'notify':
        sendParticipation(button, hidden, tr.querySelector('input.notification-time').value);
        break;
      case 'rule-detail':
        openRuleDetail(hidden);
        break;
      case 'events':
        openRuleEvents(hidden);
        break;
    }
  });


  // =====================================================================
  //  下の表（環境・バージョンごとの人数）。数字をクリックするとその画面へ移動
  // =====================================================================
  function renderVersionCounts(versionCounts, view) {
    SUB_TABLES.forEach(([tableId, gametype]) => {
      const tbody = document.querySelector('#' + tableId + ' tbody');
      const values = (versionCounts && versionCounts[tableId]) || [];
      const tr = document.createElement('tr');
      VERSION_LIST.forEach((version, i) => {
        const value = Array.isArray(values[i]) ? values[i][0] : values[i];
        const td = el('td', {
          className: 'is-clickable',

          dataset: { gametype: gametype, version: version },

    versionSelect.value = td.dataset.version;

  // =====================================================================
  //  待機・タイマー
  // =====================================================================
  async function registerWait(button, hidden, buttonType) {
    const view = currentView();
    const userId = getUserId();
    await withBusy(button, '登録中…', async () => {
      try {
        const data = await callServer('toggleButtonAndGetPageData', userId, view.gametype, view.version, hidden, buttonType, view.gametype, view.version);
        startWaitTimer();
        applyFreshPageData(data);
        showToast((buttonType === 'button1' ? '親' : '子') + '待機を登録しました（5分間）', 'success');
      } catch (error) {
        showToast('待機の登録に失敗しました: ' + errorMessage(error), 'error');
      }
    });
  }

  async function releaseWait(options = {}) {
    const userId = getStoredUserId();
    if (!userId) return;
    const view = currentView();
    try {
      const data = await callServer('toggleButtonAndGetPageData', userId, '', '', '', '', view.gametype, view.version);
      resetTimerToZero();
      applyFreshPageData(data);
      showToast(options.auto ? '待機時間が終わったため、待機を解除しました' : '待機を解除しました', 'success');
    } catch (error) {
      showToast('待機の解除に失敗しました: ' + errorMessage(error), 'error');
    }
  }

  function formatTimer(totalSeconds) {
    return new Date(Math.max(totalSeconds, 0) * 1000).toISOString().substr(11, 8);
  }

  // 終了時刻から残りを計算する（タブが裏にあって setInterval が遅れてもずれない）
  function startWaitTimer() {
    clearInterval(state.timerInterval);
    state.timerEndsAt = Date.now() + WAIT_SECONDS * 1000;
    const tick = () => {
      const remaining = Math.ceil((state.timerEndsAt - Date.now()) / 1000);
      timerElement.textContent = formatTimer(remaining);
      if (remaining <= 0) {
        clearInterval(state.timerInterval);
        state.timerInterval = null;
        releaseWait({ auto: true });
      }
    };
    tick();
    state.timerInterval = setInterval(tick, 1000);
  }

  function resetTimerToZero() {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
    state.timerEndsAt = 0;
    timerElement.textContent = '00:00:00';
  }


  // =====================================================================
  //  参加表明

    if (!dateTime) {
      showToast('参加表明の日時を入力してください。', 'error');
      return;
    }
    await withBusy(button, '送信中…', async () => {
      try {
        const result = await callServer('setParticipationClosed', hidden, dateTime);
        showToast(result.message, result.code === 0 ? 'info' : 'success');
        if (result.code !== 0) loadPage();
      } catch (error) {
        showToast('参加表明に失敗しました: ' + errorMessage(error), 'error');
      }
    });
  }

      if (event.target === document.getElementById(id)) closePopup(id);

  // ルール詳細（画面データに含まれているので通信なしで即表示）

    const row = state.rows.get(hidden);
    const details = row ? row.details : null;
    const box = document.getElementById('detailTable');
    box.textContent = '';
    if (!details) {
      box.appendChild(el('p', { text: '制限がありません。' }));
    } else if (details.length === 0) {
      box.appendChild(el('p', { className: 'multiline', text: 'ルールが設定されていません。\n制限なしにて募集してください。' }));

  function Eventcalendar_popup() {

    const note = document.getElementById('calendarNote');
    if (state.calendarId) {
      // 本番/テストの切り替えでカレンダーが変わったときも表示を差し替える
      const src = 'https://calendar.google.com/calendar/embed?src=' + encodeURIComponent(state.calendarId) + '&ctz=Asia%2FTokyo';

      note.hidden = true;

    openPopup('eventcalendar_popup');

  // =====================================================================
  //  イベント情報（ルールごと）
  // =====================================================================
  function toggleDetails(details, toggleInfo) {
    details.hidden = !details.hidden;
    toggleInfo.textContent = details.hidden ? '（クリックして詳細を表示）' : '（詳細を非表示）';
  }

  function buildDetails(description) {
    const details = el('div', null, [
      el('p', null, [el('strong', { text: '説明:' }), el('br'), el('span', { className: 'multiline', text: description || '' })]),
    ]);
    details.hidden = true;
    return details;
  }

  async function openRuleEvents(hidden) {
    const box = document.getElementById('events');
    const seq = ++state.eventsSeq;
    box.textContent = '読み込み中…';
    openPopup('eventdetail_popup');
    try {
      const events = await callServer('getEventsForRule', hidden);
      if (seq !== state.eventsSeq) return;
      renderRuleEvents(box, events);
    } catch (error) {
      if (seq !== state.eventsSeq) return;
      box.textContent = 'イベント情報を取得できませんでした: ' + errorMessage(error);
    }
  }

  function renderRuleEvents(box, events) {
    box.textContent = '';
    if (!events || events.length === 0) {
      box.textContent = '指定のルールのイベントはありません。';
      return;
    }
    events.forEach(ev => {
      const start = new Date(ev.startTime);
      const end = new Date(ev.endTime);
      const timeOptions = { hour: '2-digit', minute: '2-digit' };
      const summaryText = ev.title + ' ' + start.toLocaleDateString() + ' ' + start.toLocaleTimeString([], timeOptions) + ' - ' + end.toLocaleTimeString([], timeOptions);

      const toggleInfo = el('span', { className: 'toggle-info', text: '（クリックして詳細を表示）' });
      const summary = el('div', { className: 'event-summary' }, [el('strong', { text: summaryText }), el('br'), toggleInfo]);
      const details = buildDetails(ev.description);
      summary.addEventListener('click', () => toggleDetails(details, toggleInfo));

      const count = el('span', { className: 'participant-count', text: String(ev.participantCount || 0) });
      const participateButton = el('button', { type: 'button', text: '参加予定' });
      participateButton.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        participateEvent(participateButton, ev, count);
      });

      box.appendChild(el('div', { className: 'event-item' }, [summary, details, el('div', { className: 'event-actions' }, [participateButton, count])]));
    });
  }

  function participateEvent(button, ev, countElement) {
    withBusy(button, '登録中…', async () => {
      try {
        const count = await callServer('setparticipateEvent', ev.eventid, getUserId());
        countElement.textContent = String(count);
        showToast('イベント「' + ev.title + '」への参加を予定しました', 'success');
      } catch (error) {
        showToast('参加予定の登録に失敗しました: ' + errorMessage(error), 'error');
      }
    });
  }


  // =====================================================================
  //  イベントの作成・変更・削除
  // =====================================================================
  function Eventsetting_popup() {
    openPopup('eventsetting_popup');
    loadRuleOptions();
  }

  function fillRuleOptions(select, rules) {
    select.textContent = '';
    rules.forEach(rule => select.appendChild(el('option', { value: rule.hidden, text: rule.rule })));
  }

  async function loadRuleOptions() {
    const key = insertplatform.value + '|' + insertversion.value;
    const select = document.getElementById('insertrule');
    if (state.rulesCache[key]) {
      fillRuleOptions(select, state.rulesCache[key]);
      return;
    }
    select.textContent = '';
    select.appendChild(el('option', { value: '', text: '読み込み中…' }));
    try {
      const rules = await callServer('getRules', insertplatform.value, insertversion.value);
      state.rulesCache[key] = rules;
      if (key === insertplatform.value + '|' + insertversion.value) fillRuleOptions(select, rules);
    } catch (error) {
      select.textContent = '';
      select.appendChild(el('option', { value: '', text: 'ルールを取得できませんでした' }));
      showToast('ルール一覧の取得に失敗しました: ' + errorMessage(error), 'error');
    }
  }

  insertplatform.addEventListener('change', loadRuleOptions);
  insertversion.addEventListener('change', loadRuleOptions);

  function validateRange(startValue, endValue) {
    if (!startValue || !endValue) return '開始日時と終了日時を入力してください。';
    if (new Date(endValue).getTime() <= new Date(startValue).getTime()) return '終了日時は開始日時より後にしてください。';
    return '';
  }

  function generateRequestId() {
    return 'req-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }

  // フォームを書き換えたら「別の送信」として扱う
  document.getElementById('tab-insert').addEventListener('input', () => { state.addRequestId = null; });
  document.getElementById('tab-insert').addEventListener('change', () => { state.addRequestId = null; });

  document.getElementById('eventsetting_button').addEventListener('click', event => {
    event.preventDefault();
    event.stopPropagation();
    const button = event.currentTarget;

    const eventData = {
      title: document.getElementById('title').value.trim(),
      startTime: document.getElementById('startTime').value,
      endTime: document.getElementById('endTime').value,
      platform: insertplatform.value,
      version: insertversion.value,
      rule: document.getElementById('insertrule').value,
      description: document.getElementById('description').value,
    };
    const problem = !eventData.title ? 'タイトルを入力してください。'
      : (validateRange(eventData.startTime, eventData.endTime) || (!eventData.rule ? 'ルールを選択してください。' : ''));
    if (problem) {
      showToast(problem, 'error');
      return;
    }

    // タイムアウト後に押し直しても二重登録されないよう、同じ送信には同じIDを付ける
    if (!state.addRequestId) state.addRequestId = generateRequestId();
    eventData.requestId = state.addRequestId;

    withBusy(button, '追加中…', async () => {
      try {
        const response = await callServer('addCalendarEvent', eventData, getUserId());
        state.addRequestId = null;
        if (response && response.success) {
          showToast(response.message, 'success');
          loadPage();
        } else {
          showToast('エラー: ' + ((response && response.message) || '不明なエラー'), 'error');
        }
      } catch (error) {
        showToast('イベントの追加に失敗しました: ' + errorMessage(error) + '\n（もう一度押しても二重登録にはなりません）', 'error', 12000);
      }
    });
  });

  function openTab(evt, tabName) {
    if (evt) {
      evt.preventDefault();
      evt.stopPropagation();
    }
    ['tab-insert', 'tab-update'].forEach(id => {
      document.getElementById(id).style.display = (id === tabName) ? 'block' : 'none';
    });
    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
    if (evt && evt.currentTarget) evt.currentTarget.classList.add('active');
    if (tabName === 'tab-update') loadMyEvents();
  }

  function toLocalInputValue(date) {
    const pad = n => String(n).padStart(2, '0');
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
  }

  async function loadMyEvents() {
    const box = document.getElementById('update-myevents');
    const seq = ++state.myEventsSeq;
    box.textContent = '読み込み中…';
    try {
      const events = await callServer('getMyEvents', getUserId());
      if (seq !== state.myEventsSeq) return;
      renderMyEvents(box, events);
    } catch (error) {
      if (seq !== state.myEventsSeq) return;
      box.textContent = 'イベントを取得できませんでした: ' + errorMessage(error);
    }
  }

  function renderMyEvents(box, events) {
    box.textContent = '';
    if (!events || events.length === 0) {
      box.textContent = '自分の作成したイベントはありません。';
      return;
    }
    events.forEach((ev, index) => {
      const toggleInfo = el('span', { className: 'toggle-info', text: '（クリックして詳細を表示）' });
      const summary = el('div', { className: 'event-summary' }, [el('strong', { text: ev.title + ' [' + ev.platform + '] [' + ev.version + ']' }), ' ', toggleInfo]);
      const details = buildDetails(ev.description);
      summary.addEventListener('click', () => toggleDetails(details, toggleInfo));

      const startInput = el('input', { type: 'datetime-local', value: toLocalInputValue(new Date(ev.startTime)) });
      const endInput = el('input', { type: 'datetime-local', value: toLocalInputValue(new Date(ev.endTime)) });
      const times = el('div', null, [el('p', null, ['開始日時: ', startInput]), el('p', null, ['終了日時: ', endInput])]);

      const updateButton = el('button', { type: 'button', text: '更新' });
      updateButton.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        updateMyEvent(updateButton, ev, startInput.value, endInput.value);
      });
      const deleteButton = el('button', { type: 'button', text: '削除' });
      deleteButton.addEventListener('click', event => {
        event.preventDefault();
        event.stopPropagation();
        deleteMyEvent(deleteButton, ev, startInput.value, endInput.value);
      });

      box.appendChild(el('h3', { text: 'イベント ' + (index + 1) }));
      box.appendChild(el('div', null, [summary, details, times, el('div', { className: 'event-actions' }, [updateButton, deleteButton])]));
      box.appendChild(el('hr'));
    });
  }

  function buildEventPayload(ev, startValue, endValue) {
    return {
      title: ev.title,
      startDateTime: startValue,
      endDateTime: endValue,
      platform: ev.platform,
      version: ev.version,
      rule: ev.location,
      description: ev.description,
    };
  }

  function updateMyEvent(button, ev, startValue, endValue) {
    const problem = validateRange(startValue, endValue);
    if (problem) {
      showToast(problem, 'error');
      return;
    }
    withBusy(button, '更新中…', async () => {
      try {
        const response = await callServer('updateCalendarEvent', ev.eventid, buildEventPayload(ev, startValue, endValue), getUserId());
        if (response && response.success) {
          showToast(response.message, 'success');
          loadMyEvents();
          loadPage();
        } else {
          showToast('エラー: ' + ((response && response.message) || '不明なエラー'), 'error');
        }
      } catch (error) {
        showToast('イベントの更新に失敗しました: ' + errorMessage(error), 'error');
      }
    });
  }

  function deleteMyEvent(button, ev, startValue, endValue) {
    if (!confirm('イベント「' + ev.title + '」を削除します。元に戻せません。よろしいですか？')) return;
    withBusy(button, '削除中…', async () => {
      try {
        const response = await callServer('deleteCalendarEvent', ev.eventid, buildEventPayload(ev, startValue, endValue), getUserId());
        if (response && response.success) {
          showToast(response.message, 'success');
          loadMyEvents();
          loadPage();
        } else {
          showToast('エラー: ' + ((response && response.message) || '不明なエラー'), 'error');
        }
      } catch (error) {
        showToast('イベントの削除に失敗しました: ' + errorMessage(error), 'error');
      }
    });
  }


  // =====================================================================
  //  初期化
  // =====================================================================
  document.getElementById('mainForm').addEventListener('submit', event => event.preventDefault());

  document.getElementById('ChangeButton').addEventListener('click', event => {
    event.preventDefault();
    changeView();
  });
  gametypeSelect.addEventListener('change', changeView);  // 選んだ時点で切り替える
  versionSelect.addEventListener('change', changeView);

  document.getElementById('button1').addEventListener('click', event => {
    event.preventDefault();
    const button = event.currentTarget;
    withBusy(button, '更新中…', () => loadPage({ userAction: true, showLoading: true }));
  });

  document.getElementById('button2').addEventListener('click', event => {
    event.preventDefault();
    const button = event.currentTarget;
    withBusy(button, '解除中…', () => releaseWait());
  });

  document.getElementById('tab-update').style.display = 'none';
  console.log('ユーザーID: ' + getUserId());
  loadPage({ showLoading: true });
</script>
</body>
</html>
